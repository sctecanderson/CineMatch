<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMatch — Encontre sua próxima série</title>

    <link rel="icon" href="assets/favicon.png">
    <link rel="stylesheet" href="css/style.css">    
    <script type="module" src="js/app.js"></script>

    <meta name="description"
        content="CineMatch — Encontre séries e filmes compatíveis com o seu perfil através de recomendações personalizadas.">
    <!-- Exigência: O RF01 e o RF13 -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="CineMatch — Encontre sua próxima série">
    <meta property="og:description"
        content="Descubra novas séries com base nos seus gêneros favoritos com dados em tempo real da TVMaze.">
    <meta property="og:image" content="assets/logo.png">
</head>

<body>
    <!-- Link de acessibilidade para navegação por teclado -->
    <a class="skip" href="#content">Pular para o conteúdo</a>

    <!-- Onde todo o conteúdo é renderizado dinamicamente pelo JavaScript -->
    <div id="app"></div>

    <!-- Janela modal nativa para trailers e avisos -->
    <dialog id="modal" aria-label="Detalhes"></dialog>

    <!-- Notificações rápidas na tela -->
    <div id="toast" role="status" aria-live="polite"></div>

    <!-- Botão flutuante de retorno ao topo -->
    <button id="back-to-top" data-action="voltar-topo" aria-label="Voltar ao topo" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m6 15 6-6 6 6" />
        </svg>
    </button>

    <noscript>Este projeto precisa de JavaScript ativado para funcionar.</noscript>
</body>

</html>
